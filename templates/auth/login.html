{% extends "base.html" %}
{% block title %}Sign in · Malware Detection Using AI{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card auth-card">
    <h1>Sign in</h1>
    <p class="sub">Malware Detection Using AI — Security Console</p>
    <form method="post" data-single-submit novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required autocomplete="username"
             value="{{ email or '' }}" placeholder="you@example.com">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        <button type="button" class="pw-toggle" data-pw-toggle="password">Show</button>
      </div>
      <button class="btn" type="submit" style="width:100%">Sign in</button>
    </form>
    <p class="sub" style="margin-top:16px">No account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
  </div>
</div>
{% endblock %}
