{% extends "base.html" %}
{% block title %}Create account · Malware Detection Using AI{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card auth-card">
    <h1>Create account</h1>
    <p class="sub">Register a security analyst account</p>
    <form method="post" data-single-submit novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required value="{{ name or '' }}" maxlength="120">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required value="{{ email or '' }}">
      <label for="password">Password (min 8 characters)</label>
      <div class="pw-wrap">
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        <button type="button" class="pw-toggle" data-pw-toggle="password">Show</button>
      </div>
      <button class="btn" type="submit" style="width:100%">Create account</button>
    </form>
    <p class="sub" style="margin-top:16px">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
